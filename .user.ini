; 動画アップロード時の 413 (Content Too Large) 対策。
; 共有レンタルサーバー等のCGI/FastCGI版PHPでは .htaccess の php_value が効かないため、
; この .user.ini で upload_max_filesize / post_max_size を引き上げる（上限50GB）。
; 反映には数分〜最大5分ほどかかる場合があります（.user.ini のキャッシュ間隔）。
; ※ サーバー契約プランによってはディスク容量やサーバーパネル側の制限が
;    別途存在する場合があるため、50GBの巨大ファイルを送る前提なら
;    そちらの上限も確認してください。

upload_max_filesize = 50G
post_max_size = 50G
max_execution_time = 1800
max_input_time = 1800
memory_limit = 10G
