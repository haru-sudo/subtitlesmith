<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f6f7f9">
    <meta name="format-detection" content="telephone=no">
    <title>ログイン</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/subtitlesmith/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/subtitlesmith/assets/favicon.png">
    <link rel="apple-touch-icon" href="/subtitlesmith/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/subtitlesmith/assets/css/demo.css">
    <script src="/subtitlesmith/assets/js/demo-data.js"></script>
    <script src="/subtitlesmith/assets/js/demo.js"></script>
    <link rel="stylesheet" href="/subtitlesmith/assets/css/app.css">
    <script>window.APP_BASE = "\/subtitlesmith"; window.APP_LATEST_NEWS = "";</script>
    <script src="/subtitlesmith/assets/js/common.js"></script>
</head>
<body>

<main class="container">
    <div class="auth-card">
    <h1>subtitlesmith</h1>
    <p class="muted">許可されたアカウントでログインしてください。</p>

    
    
            <div class="auth-providers" style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
                                                <a class="gsi-material-button" href="/subtitlesmith/auth/oidc/google">
                    <div class="gsi-material-button-state"></div>
                    <div class="gsi-material-button-content-wrapper">
                        <div class="gsi-material-button-icon">
                            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" style="display:block;">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                                <path fill="none" d="M0 0h48v48H0z"></path>
                            </svg>
                        </div>
                        <span class="gsi-material-button-contents">Google でログイン</span>
                    </div>
                </a>
                            </div>
    
                        <p class="muted" style="margin:16px 0 8px;">または</p>
                <form method="post" action="/subtitlesmith/login" class="auth-password" style="display:flex;flex-direction:column;gap:8px;text-align:left;">
            <label>メールアドレス
                <input type="email" name="email" autocomplete="username" required>
            </label>
            <label>パスワード
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn primary" style="width:100%;justify-content:center;">ログイン</button>
        </form>
    
    </div>

</main>
<footer class="site-footer muted">
    <a href="https://github.com/haru-sudo/subtitlesmith" rel="noopener">ソースコード</a>（GNU AGPL-3.0）
</footer>
</body>
</html>
